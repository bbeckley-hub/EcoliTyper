# environment.yml
name: ecolityper
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python >=3.8
  - pandas >=1.5.0
  - biopython >=1.80
  - psutil >=5.9.0
  - requests >=2.28.0
  - tqdm >=4.64.0
  - click >=8.0.0
  - tabulate >=0.9.0
  - beautifulsoup4 >=4.11.0
  - lxml >=4.9.0
  - matplotlib >=3.5.0
  - seaborn >=0.12.0
  - scipy >=1.10.1
  - plotly >=5.10.0
  - abricate >=1.2.0
  - fastani >=1.34
  - ezclermont >=0.7.0
  - perl
  - any2fasta
  - cgecore >=1.5.6
  - blast >=2.13.0
  - perl-moo
  - perl-list-moreutils
  - perl-json
  - perl-lwp-protocol-https
  - perl-path-tiny
  - perl-data-dumper
  - perl-getopt-long
  - perl-file-which
  - pip
  - pip:
    - -e .
